name: model-hive

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the one dependency (git is the other)
        run: python -m pip install "cryptography>=43"
      - name: Tools on this runner
        run: |
          git --version
          python -c "import shutil; print('ssh-keygen:', shutil.which('ssh-keygen'))"
      - name: The model home is exactly what the story builds
        run: python -B tools/build_example.py --check
      - name: Journeys, attacks, interop with stock git and ssh-keygen, RAPP/1 parity
        run: python -B -m unittest discover -s tests -v
